<style>
  :root{
    --bg:#15130F;
    --bg-raised:#1D1A14;
    --bg-card:#221E17;
    --line:#3A3427;
    --line-soft:#2A261D;
    --chalk:#EDE9E0;
    --chalk-dim:#A39C8C;
    --chalk-faint:#6E6858;
    --rust:#C4491D;
    --rust-bright:#E8632E;
    --steel:#4A6FA5;
    --steel-bright:#6E93C9;
    --moss:#5A7247;
    --moss-bright:#7A9863;
    --amber:#C99A3E;
  }
  *{-webkit-tap-highlight-color: transparent;}
  html,body{background:var(--bg); color:var(--chalk); font-family:'Inter',sans-serif; overscroll-behavior-y: none;}
  .font-display{font-family:'Oswald',sans-serif; letter-spacing:0.01em;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{display:none;}
  * {scrollbar-width: none;}

  .stencil-border{
    border: 2px solid var(--line);
  }
  .texture-noise{
    background-image: radial-gradient(circle at 1px 1px, rgba(237,233,224,0.04) 1px, transparent 0);
    background-size: 14px 14px;
  }
  .chip-hazard{
    background-image: repeating-linear-gradient(45deg, var(--rust) 0, var(--rust) 10px, #1A1712 10px, #1A1712 20px);
  }
  .card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .card-header{
    border-bottom: 1px solid var(--line);
  }
  .btn-primary{
    background: var(--rust);
    color: #FFF6EE;
  }
  .btn-primary:active{ background: var(--rust-bright); transform: scale(0.98); }
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
  }
  .btn-ghost:active{ background: var(--line-soft); }
  .btn-steel{
    background: var(--steel);
    color: #F2F6FB;
  }
  .btn-steel:active{ background: var(--steel-bright); }

  input, select, textarea{
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--chalk);
    border-radius: 8px;
  }
  input:focus, select:focus, textarea:focus{
    outline: none;
    border-color: var(--rust);
    box-shadow: 0 0 0 3px rgba(196,73,29,0.15);
  }
  input[type="range"]{
    -webkit-appearance: none;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height: 6px;
    border-radius: 3px;
    background: var(--line);
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    margin-top: -8px;
    height: 20px;
    width: 20px;
    border-radius: 50%;
    background: var(--rust);
    border: 3px solid #FFF6EE;
  }

  .tab-btn.active .tab-icon{ color: var(--rust-bright); }
  .tab-btn.active .tab-label{ color: var(--chalk); }
  .tab-btn .tab-icon{ color: var(--chalk-faint); }
  .tab-btn .tab-label{ color: var(--chalk-faint); }

  .pill{
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--chalk-dim);
  }
  .pill.selected{
    background: var(--rust);
    border-color: var(--rust);
    color: #FFF6EE;
  }
  .pill-steel.selected{
    background: var(--steel);
    border-color: var(--steel);
    color: #F2F6FB;
  }

  .check-row{
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg-raised);
  }
  .check-row.checked{
    border-color: var(--moss);
    background: rgba(90,114,71,0.12);
  }

  .pain-track{ background: linear-gradient(90deg, var(--moss) 0%, var(--amber) 55%, var(--rust) 100%); }

  .safety-alert{
    background: linear-gradient(180deg, rgba(196,73,29,0.18), rgba(196,73,29,0.06));
    border: 1.5px solid var(--rust);
  }

  .fade-in{ animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .banner-shift{ animation: shift 0.2s ease-out; }
  @keyframes shift{ from{opacity:0.3; transform: translateX(-6px);} to{opacity:1; transform: translateX(0);} }

  .accordion-content{ max-height:0; overflow:hidden; transition: max-height 0.28s ease; }
  .accordion-content.open{ max-height: 2000px; }

  .diagonal-tag{
    background: var(--rust);
    color: #FFF6EE;
  }

  .safe-top{ padding-top: env(safe-area-inset-top); }
  .safe-bottom{ padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>

<div id="app" class="max-w-md mx-auto min-h-screen flex flex-col relative">

      </div>
    </div>
  </div>

    <!-- Views injected here -->
  </main>

  <!-- ===================== BOTTOM NAV ===================== -->
  <nav class="safe-bottom fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1A1712] border-t z-40" style="border-color:var(--line);">
    <div class="grid grid-cols-5">
      <button data-tab="logger" class="tab-btn active flex flex-col items-center justify-center gap-1 py-2.5">
        <i data-lucide="pencil-line" class="tab-icon w-5 h-5"></i>
        <span class="tab-label text-[9.5px] font-medium tracking-wide">Logger</span>
      </button>
      <button data-tab="recovery" class="tab-btn flex flex-col items-center justify-center gap-1 py-2.5">
        <i data-lucide="moon" class="tab-icon w-5 h-5"></i>
        <span class="tab-label text-[9.5px] font-medium tracking-wide">Recovery</span>
      </button>
      <button data-tab="history" class="tab-btn flex flex-col items-center justify-center gap-1 py-2.5">
        <i data-lucide="calendar-days" class="tab-icon w-5 h-5"></i>
        <span class="tab-label text-[9.5px] font-medium tracking-wide">History</span>
      </button>
      <button data-tab="stats" class="tab-btn flex flex-col items-center justify-center gap-1 py-2.5">
        <i data-lucide="trending-up" class="tab-icon w-5 h-5"></i>
        <span class="tab-label text-[9.5px] font-medium tracking-wide">Stats</span>
      </button>
      <button data-tab="settings" class="tab-btn flex flex-col items-center justify-center gap-1 py-2.5">
        <i data-lucide="settings" class="tab-icon w-5 h-5"></i>
        <span class="tab-label text-[9.5px] font-medium tracking-wide">Settings</span>
      </button>
    </div>
  </nav>

  <!-- ===================== SAFETY POP-UP MODAL ===================== -->
  <div id="safetyModalOverlay" class="hidden fixed inset-0 z-50 flex items-end justify-center px-4 pb-6" style="background:rgba(0,0,0,0.6);">
    <div class="w-full max-w-md rounded-2xl p-5 fade-in" style="background:var(--bg-card); border:1.5px solid var(--rust);">
      <div class="flex items-center gap-2 mb-2">
        <i data-lucide="alert-triangle" class="w-6 h-6" style="color:var(--rust-bright);"></i>
        <span class="font-display text-base font-semibold uppercase tracking-wide" style="color:var(--rust-bright);">Pain Threshold Reached</span>
      </div>
      <p id="safetyModalText" class="text-sm leading-relaxed mb-4" style="color:var(--chalk);"></p>
      <button id="safetyModalDismiss" class="btn-primary w-full py-3 rounded-xl font-display font-semibold text-sm uppercase tracking-widest">Got It — I'll Back Off</button>
    </div>
  </div>

</div>

/* ---------------------------- STATE ---------------------------- */
const STORAGE_KEY = "sendlog_state_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn("State load failed", e); }
  return null;
}

function defaultDailyEntry(){
  return {
    date: todayISO(),
    phase: "p1",
    deload: false,
    warmup: { wu1:false, wu2:false, wu3:false },
    sleepHours: null,
    sleepQuality: null,
    pain: { fingers: 0, elbows: 0, shoulders: 0 },
    rpe: null,
    fallReasons: [],
    climb: { duration: "", sessionType: "", grades: {} }, // grades: {V4: count, ...}
    gym: { preset: "", sets: {} }, // sets: { exerciseName: [{sets,reps,weight,rpe}] }
    notes: "",

    // ---- Recovery & Lifestyle (Part 2) ----
    evening: { ev1:false, ev2:false, ev3:false, ev4:false, ev5:false },
    skin: { callus:false, moisturizer:false, flapperCheck:false },
    walkMinutes: null,
    zone2: { done:false, minutes:null, mode:"" }, // mode: cycling / uphill walk / easy jog
    bodyWeight: null,
    macros: { protein:false, carbs:false, fats:false },
    fuel: { pre:false, post:false },
    supplements: { creatine:false, electrolytes:false },
    waterMl: null,
    caffeineLate: null, // true = had late caffeine (bad), false = avoided, null = unset
  };
}

function migrateEntry(e){
  // Ensure entries created before Part 2 have the new fields
  const d = defaultDailyEntry();
  e.evening = e.evening || d.evening;
  e.skin = e.skin || d.skin;
  e.walkMinutes = (e.walkMinutes !== undefined) ? e.walkMinutes : d.walkMinutes;
  e.zone2 = e.zone2 || d.zone2;
  e.bodyWeight = (e.bodyWeight !== undefined) ? e.bodyWeight : d.bodyWeight;
  e.macros = e.macros || d.macros;
  e.fuel = e.fuel || d.fuel;
  e.supplements = e.supplements || d.supplements;
  e.waterMl = (e.waterMl !== undefined) ? e.waterMl : d.waterMl;
  e.caffeineLate = (e.caffeineLate !== undefined) ? e.caffeineLate : d.caffeineLate;
  return e;
}

function todayISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

let state = loadState() || {
  entries: {},          // keyed by date ISO -> entry
  lastSpiteIndex: -1,
  settings: { heightCm: 192, targetWeightKg: 70 },
};

if(!state.settings) state.settings = { heightCm: 192, targetWeightKg: 70 };

// migrate every stored entry to include Part 2 fields
Object.keys(state.entries).forEach(k=>{
  state.entries[k] = migrateEntry(state.entries[k]);
});

// ensure today's entry exists
if(!state.entries[todayISO()]){
  state.entries[todayISO()] = defaultDailyEntry();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.warn("State save failed", e); }
}

function currentEntry(){
  return state.entries[todayISO()];
}

/* ---------------------------- SPITE BANNER LOGIC ---------------------------- */
function cycleSpite(){
  let idx;
  do{
    idx = Math.floor(Math.random() * SPITE_QUOTES.length);
  } while(idx === state.lastSpiteIndex && SPITE_QUOTES.length > 1);
  state.lastSpiteIndex = idx;
  const el = document.getElementById("spiteText");
  el.classList.remove("banner-shift");
  void el.offsetWidth;
  el.classList.add("banner-shift");
  el.textContent = SPITE_QUOTES[idx];
  saveState();
}

function initSpite(){
  // pick a quote deterministic-ish for app open, but randomized
  const idx = Math.floor(Math.random() * SPITE_QUOTES.length);
  state.lastSpiteIndex = idx;
  document.getElementById("spiteText").textContent = SPITE_QUOTES[idx];
  document.getElementById("spiteBtn").addEventListener("click", cycleSpite);
}

/* ---------------------------- TAB NAVIGATION ---------------------------- */
let activeTab = "logger";
let protocolExpanded = false;

function initTabs(){
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      activeTab = btn.dataset.tab;
      renderMain();
      document.getElementById("mainContent").scrollTop = 0;
    });
  });
}

function renderMain(){
  const main = document.getElementById("mainContent");
  if(activeTab === "logger"){
    main.innerHTML = renderLogger();
  } else if(activeTab === "recovery"){
    main.innerHTML = renderRecovery();
  } else if(activeTab === "history"){
    main.innerHTML = renderHistory();
  } else if(activeTab === "stats"){
    main.innerHTML = renderStats();
  } else if(activeTab === "settings"){
    main.innerHTML = renderSettings();
  }
  lucide.createIcons();

  if(activeTab === "logger") attachLoggerHandlers();
  if(activeTab === "recovery") attachRecoveryHandlers();
  if(activeTab === "history") attachHistoryHandlers();
  if(activeTab === "stats") attachStatsHandlers();
  if(activeTab === "settings") attachSettingsHandlers();
}

function renderPainSlider(key, label, value){
  const danger = value >= 5;

    </div>
    <input type="range" data-pain="${key}" min="0" max="10" step="1" value="${value}" class="w-full pain-input">
  </div>`;
}

        <div class="grid grid-cols-4 gap-1.5">
          <div>
            <label class="text-[9px] uppercase tracking-wide block mb-1" style="color:var(--chalk-faint);">Sets</label>
            <input type="number" data-ex-field="${presetKey}|${ex.name}|sets" min="0" value="${saved.sets}" class="w-full px-1.5 py-1.5 text-xs text-center">

          </div>
          <div>

function renderSafetyAlert(pain){
  const parts = painPartsText(pain);
  return `
  <div class="safety-alert rounded-xl p-4 flex gap-3">
    <i data-lucide="alert-triangle" class="w-6 h-6 flex-shrink-0 mt-0.5" style="color:var(--rust-bright);"></i>
    <div>
      <p class="font-display text-sm font-semibold uppercase tracking-wide mb-1" style="color:var(--rust-bright);">Pain Threshold Reached</p>
      <p class="text-sm leading-snug" style="color:var(--chalk);">${parts} — reduce volume today. Tendons don't negotiate. Back off intensity or switch to technique-only work.</p>
    </div>
  </div>`;
}

function painPartsText(pain){
  const parts = [];
  if(pain.fingers >= 5) parts.push(`Fingers ${pain.fingers}/10`);
  if(pain.elbows >= 5) parts.push(`Elbows ${pain.elbows}/10`);
  if(pain.shoulders >= 5) parts.push(`Shoulders ${pain.shoulders}/10`);
  return parts.join(" · ");
}

let safetyModalShownToday = false;

function showSafetyModal(pain){
  if(safetyModalShownToday) return; // don't spam on every slider tick within the same day
  safetyModalShownToday = true;
  const overlay = document.getElementById("safetyModalOverlay");
  const textEl = document.getElementById("safetyModalText");
  if(!overlay || !textEl) return;
  textEl.textContent = `${painPartsText(pain)} — that's at or above your 5/10 threshold. Back off volume today. Switch to technique-only work, or take the rest. Tendons don't negotiate.`;
  overlay.classList.remove("hidden");
  lucide.createIcons();
}

function hideSafetyModal(){
  const overlay = document.getElementById("safetyModalOverlay");
  if(overlay) overlay.classList.add("hidden");
}

/* ---------------------------- HANDLERS ---------------------------- */
function attachLoggerHandlers(){
  if(activeTab !== "logger") return;
  const e = currentEntry();

  const protocolToggle = document.querySelector("[data-protocol-toggle]");
  if(protocolToggle) protocolToggle.addEventListener("click", ()=>{
    protocolExpanded = !protocolExpanded;
    renderMain();
  });

  const phaseSelect = document.getElementById("phaseSelect");
  if(phaseSelect) phaseSelect.addEventListener("change", (ev)=>{
    e.phase = ev.target.value;
    saveState();
    renderMain();
  });

  const deloadToggle = document.getElementById("deloadToggle");
  if(deloadToggle) deloadToggle.addEventListener("change", (ev)=>{
    e.deload = ev.target.checked;
    saveState();
    renderMain();
  });

  document.querySelectorAll("[data-warmup]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.warmup;
      e.warmup[id] = !e.warmup[id];
      saveState();
      renderMain();
    });
  });

  const sleepHours = document.getElementById("sleepHours");
  if(sleepHours) sleepHours.addEventListener("input", (ev)=>{
    e.sleepHours = ev.target.value === "" ? null : parseFloat(ev.target.value);
    saveState();
  });

  document.querySelectorAll("[data-sleepq]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      e.sleepQuality = parseInt(btn.dataset.sleepq);
      saveState();
      renderMain();
    });
  });

  const rpeSlider = document.getElementById("rpeSlider");
  if(rpeSlider){
    rpeSlider.addEventListener("input", (ev)=>{
      document.getElementById("rpeValue").textContent = ev.target.value;
    });
    rpeSlider.addEventListener("change", (ev)=>{
      e.rpe = parseInt(ev.target.value);
      saveState();
    });
  }

  document.querySelectorAll("[data-pain]").forEach(slider=>{
    slider.addEventListener("input", (ev)=>{
      const key = slider.dataset.pain;
      e.pain[key] = parseInt(ev.target.value);
      const valEl = slider.previousElementSibling.querySelector("span:last-child");
      if(valEl){
        valEl.textContent = e.pain[key];
        const danger = e.pain[key] >= 5;
        valEl.style.color = danger ? "#FFF6EE" : "var(--chalk)";
        valEl.style.background = danger ? "var(--rust)" : "var(--bg-raised)";
      }
    });
    slider.addEventListener("change", ()=>{
      saveState();
      const maxPain = Math.max(e.pain.fingers, e.pain.elbows, e.pain.shoulders);
      if(maxPain >= 5) showSafetyModal(e.pain);
      renderMain(); // re-render to show/hide safety alert
    });
  });

  document.querySelectorAll("[data-fallreason]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const reason = btn.dataset.fallreason;
      const idx = e.fallReasons.indexOf(reason);
      if(idx >= 0) e.fallReasons.splice(idx,1);
      else e.fallReasons.push(reason);
      saveState();
      renderMain();
    });
  });

  const climbDuration = document.getElementById("climbDuration");
  if(climbDuration) climbDuration.addEventListener("input", (ev)=>{
    e.climb.duration = ev.target.value;
    saveState();
  });

  const climbSessionType = document.getElementById("climbSessionType");
  if(climbSessionType) climbSessionType.addEventListener("change", (ev)=>{
    e.climb.sessionType = ev.target.value;
    saveState();
  });

  document.querySelectorAll("[data-grade-inc]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const g = btn.dataset.gradeInc;
      e.climb.grades[g] = (e.climb.grades[g] || 0) + 1;
      saveState();
      renderMain();
    });
  });
  document.querySelectorAll("[data-grade-dec]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const g = btn.dataset.gradeDec;
      e.climb.grades[g] = Math.max(0, (e.climb.grades[g] || 0) - 1);
      saveState();
      renderMain();
    });
  });

  document.querySelectorAll("[data-gympreset]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const preset = btn.dataset.gympreset;
      e.gym.preset = e.gym.preset === preset ? "" : preset;
      saveState();
      renderMain();
    });
  });

  document.querySelectorAll("[data-ex-field]").forEach(input=>{
    input.addEventListener("input", (ev)=>{
      const [preset, exName, field] = input.dataset.exField.split("|");
      if(!e.gym.sets[exName]) e.gym.sets[exName] = { sets:"", reps:"", weight:"", rpe:"" };
      e.gym.sets[exName][field] = ev.target.value;
      saveState();
    });
  });

  const notesField = document.getElementById("notesField");
  if(notesField) notesField.addEventListener("input", (ev)=>{
    e.notes = ev.target.value;
    saveState();
  });

  const saveBtn = document.getElementById("saveEntryBtn");
  if(saveBtn) saveBtn.addEventListener("click", ()=>{
    saveState();
    const confirm = document.getElementById("saveConfirm");
    confirm.classList.remove("hidden");
    saveBtn.classList.add("opacity-70");
    setTimeout(()=>{
      confirm.classList.add("hidden");
      saveBtn.classList.remove("opacity-70");
    }, 1800);
  });
}

  return `

    <!-- EVENING ROUTINE -->
    <div class="card p-4">

function weeklyWeightAverage(){
  const dates = last7DatesISO();
  const vals = dates.map(d => state.entries[d] && state.entries[d].bodyWeight).filter(v => v !== null && v !== undefined && v !== "");
  if(vals.length === 0) return null;
  const avg = vals.reduce((a,b)=>a+parseFloat(b),0) / vals.length;
  return Math.round(avg * 10) / 10;
}

function last7DatesISO(){
  const out = [];
  for(let i=0;i<7;i++){
    const d = new Date();
    d.setDate(d.getDate() - i);
    out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
  }
  return out;
}

function attachRecoveryHandlers(){
  if(activeTab !== "recovery") return;
  const e = currentEntry();

  document.querySelectorAll("[data-evening]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.evening;
      e.evening[id] = !e.evening[id];
      saveState();
      renderMain();
    });
  });

  document.querySelectorAll("[data-skin]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.skin;
      e.skin[id] = !e.skin[id];
      saveState();
      renderMain();
    });
  });

  const walkMinutes = document.getElementById("walkMinutes");
  if(walkMinutes) walkMinutes.addEventListener("input", (ev)=>{
    e.walkMinutes = ev.target.value === "" ? null : parseFloat(ev.target.value);
    saveState();
  });

  const zone2Toggle = document.querySelector("[data-zone2-toggle]");
  if(zone2Toggle) zone2Toggle.addEventListener("click", ()=>{
    e.zone2.done = !e.zone2.done;
    saveState();
    renderMain();
  });

  document.querySelectorAll("[data-zone2-mode]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const mode = btn.dataset.zone2Mode;
      e.zone2.mode = e.zone2.mode === mode ? "" : mode;
      saveState();
      renderMain();
    });
  });

  const zone2Minutes = document.getElementById("zone2Minutes");
  if(zone2Minutes) zone2Minutes.addEventListener("input", (ev)=>{
    e.zone2.minutes = ev.target.value === "" ? null : parseFloat(ev.target.value);
    saveState();
  });

  const bodyWeight = document.getElementById("bodyWeight");
  if(bodyWeight) bodyWeight.addEventListener("input", (ev)=>{
    e.bodyWeight = ev.target.value === "" ? null : parseFloat(ev.target.value);
    saveState();
  });
  if(bodyWeight) bodyWeight.addEventListener("change", ()=>{
    renderMain(); // refresh weekly avg
  });

  document.querySelectorAll("[data-macro]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const key = btn.dataset.macro;
      e.macros[key] = !e.macros[key];
      saveState();
      renderMain();
    });
  });

  document.querySelectorAll("[data-fuel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const key = btn.dataset.fuel;
      e.fuel[key] = !e.fuel[key];
      saveState();
      renderMain();
    });
  });

  document.querySelectorAll("[data-supp]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const key = btn.dataset.supp;
      e.supplements[key] = !e.supplements[key];
      saveState();
      renderMain();
    });
  });

  const waterMl = document.getElementById("waterMl");
  if(waterMl) waterMl.addEventListener("input", (ev)=>{
    e.waterMl = ev.target.value === "" ? null : parseFloat(ev.target.value);
    saveState();
  });

  document.querySelectorAll("[data-caffeine]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const val = btn.dataset.caffeine === "had";
      e.caffeineLate = (e.caffeineLate === val) ? null : val;
      saveState();
      renderMain();
    });
  });
}

let historyFilters = { type: "all", painFlag: false };
let expandedHistoryDate = null;
let editingHistoryDate = null;

function getAllEntriesSorted(){
  return Object.values(state.entries).sort((a,b)=> b.date.localeCompare(a.date));
}

function entryHasPainFlag(e){
  return Math.max(e.pain.fingers, e.pain.elbows, e.pain.shoulders) >= 5;
}

function entrySessionTypeLabel(e){
  const hasClimb = e.climb.duration || e.climb.sessionType || Object.values(e.climb.grades||{}).some(v=>v>0);
  const hasGym = !!e.gym.preset;
  if(hasClimb && hasGym) return "Climb + Gym";
  if(hasClimb) return "Climbing";
  if(hasGym) return "Gym";
  return "No Session";
}

function renderHistory(){
  let entries = getAllEntriesSorted();

  if(historyFilters.type === "climb") entries = entries.filter(e => entrySessionTypeLabel(e).includes("Climb"));
  if(historyFilters.type === "gym") entries = entries.filter(e => entrySessionTypeLabel(e).includes("Gym"));
  if(historyFilters.painFlag) entries = entries.filter(entryHasPainFlag);

  return `
  <div class="fade-in space-y-4">

    <div class="card p-3">
      <div class="grid grid-cols-3 gap-2 mb-2">
        <button data-hist-type="all" class="pill ${historyFilters.type==='all'?'selected':''} py-2 text-[11px] font-medium">All</button>
        <button data-hist-type="climb" class="pill ${historyFilters.type==='climb'?'selected':''} py-2 text-[11px] font-medium">Climbing</button>
        <button data-hist-type="gym" class="pill pill-steel ${historyFilters.type==='gym'?'selected':''} py-2 text-[11px] font-medium">Gym</button>
      </div>
      <button data-hist-pain-toggle class="w-full flex items-center justify-center gap-2 py-2 rounded-lg text-[11px] font-medium" style="border:1px solid ${historyFilters.painFlag?'var(--rust)':'var(--line)'}; background:${historyFilters.painFlag?'rgba(196,73,29,0.15)':'transparent'}; color:${historyFilters.painFlag?'var(--rust-bright)':'var(--chalk-dim)'};">
        <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>
        Pain / Fatigue Flags Only
      </button>
    </div>

    ${entries.length === 0 ? `
      <div class="flex flex-col items-center justify-center text-center py-16 px-6">
        <i data-lucide="calendar-x" class="w-10 h-10 mb-3" style="color:var(--chalk-faint);"></i>
        <p class="text-sm" style="color:var(--chalk-dim);">No sessions match this filter.</p>
      </div>
    ` : entries.map(e => renderHistoryCard(e)).join("")}

  </div>`;
}

function renderHistoryCard(e){
  const isExpanded = expandedHistoryDate === e.date;
  const isEditing = editingHistoryDate === e.date;
  const painFlag = entryHasPainFlag(e);
  const typeLabel = entrySessionTypeLabel(e);
  const dateObj = new Date(e.date + "T00:00:00");
  const dateLabel = dateObj.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  const isToday = e.date === todayISO();

  const dotColor = typeLabel.includes("Climb") && typeLabel.includes("Gym") ? "var(--amber)" : typeLabel.includes("Climb") ? "var(--rust)" : typeLabel.includes("Gym") ? "var(--steel)" : "var(--chalk-faint)";

  return `
  <div class="card overflow-hidden">
    <button data-hist-toggle="${e.date}" class="w-full flex items-center justify-between px-4 py-3 text-left">
      <div class="flex items-center gap-3">
        <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${dotColor};"></span>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-display text-sm font-semibold">${dateLabel}</span>
            ${isToday ? `<span class="text-[9px] font-mono px-1.5 py-0.5 rounded" style="background:var(--bg-raised); color:var(--chalk-faint);">TODAY</span>` : ""}
            ${painFlag ? `<i data-lucide="alert-triangle" class="w-3.5 h-3.5" style="color:var(--rust-bright);"></i>` : ""}
          </div>
          <span class="text-xs" style="color:var(--chalk-faint);">${typeLabel}${e.climb.duration ? ` · ${e.climb.duration}min` : ""}</span>
        </div>
      </div>
      <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4 flex-shrink-0" style="color:var(--chalk-faint);"></i>
    </button>

    <div class="accordion-content ${isExpanded ? 'open' : ''}">
      <div class="px-4 pb-4 pt-1 space-y-3" style="border-top:1px solid var(--line-soft);">

        ${isEditing ? renderHistoryEditForm(e) : renderHistoryReadOnly(e)}

        <div class="flex gap-2 pt-2">
          <button data-hist-edit="${e.date}" class="btn-ghost flex-1 py-2 rounded-lg text-xs font-display font-semibold uppercase tracking-wide flex items-center justify-center gap-1.5">
            <i data-lucide="${isEditing ? 'x' : 'pencil'}" class="w-3.5 h-3.5"></i>

          <button data-hist-delete="${e.date}" class="flex-1 py-2 rounded-lg text-xs font-display font-semibold uppercase tracking-wide flex items-center justify-center gap-1.5" style="background:rgba(196,73,29,0.12); border:1px solid var(--rust); color:var(--rust-bright);">

function attachHistoryHandlers(){
  if(activeTab !== "history") return;

  document.querySelectorAll("[data-hist-type]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      historyFilters.type = btn.dataset.histType;
      renderMain();
    });
  });

  const painToggle = document.querySelector("[data-hist-pain-toggle]");
  if(painToggle) painToggle.addEventListener("click", ()=>{
    historyFilters.painFlag = !historyFilters.painFlag;
    renderMain();
  });

  document.querySelectorAll("[data-hist-toggle]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const date = btn.dataset.histToggle;
      expandedHistoryDate = expandedHistoryDate === date ? null : date;
      if(expandedHistoryDate !== date) editingHistoryDate = null;
      renderMain();
    });
  });

  document.querySelectorAll("[data-hist-edit]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const date = btn.dataset.histEdit;
      editingHistoryDate = editingHistoryDate === date ? null : date;
      renderMain();
    });
  });

  document.querySelectorAll("[data-hist-delete]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const date = btn.dataset.histDelete;
      if(confirm(`Delete the log for ${date}? This can't be undone.`)){
        delete state.entries[date];
        if(date === todayISO()){
          state.entries[date] = defaultDailyEntry();
        }
        saveState();
        expandedHistoryDate = null;
        editingHistoryDate = null;
        renderMain();
      }
    });
  });

  document.querySelectorAll("[data-edit-save]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const date = btn.dataset.editSave;
      const entry = state.entries[date];
      const container = btn.closest(".accordion-content");
      container.querySelectorAll("[data-edit-field]").forEach(input=>{
        const field = input.dataset.editField;
        if(field === "sleepHours" || field === "rpe"){
          entry[field] = input.value === "" ? null : parseFloat(input.value);
        } else {
          entry[field] = input.value;
        }
      });
      container.querySelectorAll("[data-edit-pain]").forEach(input=>{
        const key = input.dataset.editPain;
        entry.pain[key] = parseInt(input.value) || 0;
      });
      saveState();
      editingHistoryDate = null;
      renderMain();
    });
  });
}

function renderVolumeBar(label, minutes, maxMinutes, color){
  const pct = maxMinutes > 0 ? Math.max(4, (minutes / maxMinutes) * 100) : 4;
  return `
  <div>
    <div class="flex items-center justify-between mb-1">
      <span class="text-xs font-medium" style="color:var(--chalk-dim);">${label}</span>
      <span class="font-mono text-xs font-bold" style="color:${color};">${minutes}m</span>
    </div>
    <div class="w-full h-2.5 rounded-full" style="background:var(--bg-raised);">
      <div class="h-2.5 rounded-full" style="width:${pct}%; background:${color};"></div>
    </div>
  </div>`;
}

function computeWeeklyVolume(){
  const dates = last7DatesISO();
  let climbMin = 0, gymMin = 0, walkMin = 0;
  dates.forEach(d=>{
    const e = state.entries[d];
    if(!e) return;
    climbMin += parseFloat(e.climb.duration) || 0;
    if(e.gym.preset) gymMin += 60; // approx session length for gym day
    walkMin += parseFloat(e.walkMinutes) || 0;
    if(e.zone2.done) walkMin += parseFloat(e.zone2.minutes) || 0;
  });
  const maxMin = Math.max(climbMin, gymMin, walkMin, 1);
  return { climbMin, gymMin, walkMin, maxMin };
}

function computeGradeProgression(){
  const entries = getAllEntriesSorted().slice().reverse().slice(-10); // last 10 chronological
  const points = [];
  entries.forEach(e=>{
    const grades = Object.entries(e.climb.grades || {}).filter(([g,c])=>c>0).map(([g])=>g);
    if(grades.length === 0) return;
    const highest = grades.sort((a,b)=> parseInt(a.replace('V','')) - parseInt(b.replace('V','')) ).pop();
    const dateObj = new Date(e.date + "T00:00:00");
    points.push({ grade: highest, label: dateObj.toLocaleDateString('en-US',{month:'numeric',day:'numeric'}) });
  });
  return points;
}

function computeFatigueFlag(){
  const entries = getAllEntriesSorted().slice(0, 3); // 3 most recent sessions
  if(entries.length < 3) return null;
  const allHigh = entries.every(e => e.pain.fingers > 4 || e.pain.elbows > 4);
  if(allHigh){
    return "Finger or elbow pain has stayed above 4/10 across your last 3 sessions. This is a pattern, not a bad day — consider a technique-only block or a full rest until it settles.";
  }
  return null;
}

function computeDeloadSuggestion(){
  const entries = getAllEntriesSorted();
  if(entries.length === 0) return null;

  // Trigger 1: high fatigue — average RPE across last 5 sessions >= 8
  const recent = entries.slice(0, 5).filter(e => e.rpe !== null && e.rpe !== undefined);
  if(recent.length >= 3){
    const avgRpe = recent.reduce((a,e)=>a+e.rpe,0) / recent.length;
    if(avgRpe >= 8){
      return `Your average RPE across recent sessions is ${avgRpe.toFixed(1)}/10. Time to back off before it backs you off.`;
    }
  }

  // Trigger 2: every 4-6 weeks since oldest logged entry, suggest based on total logged days
  const totalDays = entries.length;
  if(totalDays > 0 && totalDays % 28 === 0){
    return `You've logged ${totalDays} training days. A deload is due roughly every 4–6 weeks — consider switching on Deload Mode in the Logger.`;
  }

  return null;
}

function attachSettingsHandlers(){
  if(activeTab !== "settings") return;

  const heightInput = document.getElementById("settingsHeight");
  if(heightInput) heightInput.addEventListener("input", (ev)=>{
    state.settings.heightCm = ev.target.value === "" ? null : parseFloat(ev.target.value);
    saveState();
  });

  const targetWeightInput = document.getElementById("settingsTargetWeight");
  if(targetWeightInput) targetWeightInput.addEventListener("input", (ev)=>{
    state.settings.targetWeightKg = ev.target.value === "" ? null : parseFloat(ev.target.value);
    saveState();
  });

  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.addEventListener("click", exportBackup);

  const importBtn = document.getElementById("importBtn");
  const importFile = document.getElementById("importFile");
  if(importBtn && importFile){
    importBtn.addEventListener("click", ()=> importFile.click());
    importFile.addEventListener("change", handleImportFile);
  }

  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    if(confirm("Erase ALL logged data on this device? This cannot be undone.")){
      localStorage.removeItem(STORAGE_KEY);
      state = { entries: {}, lastSpiteIndex: -1, settings: { heightCm: 192, targetWeightKg: 70 } };
      state.entries[todayISO()] = defaultDailyEntry();
      saveState();
      renderMain();
    }
  });
}

function exportBackup(){
  try{
    const dataStr = JSON.stringify(state, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `sendlog-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    alert("Export failed: " + e.message);
  }
}

function handleImportFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported.entries) throw new Error("Invalid backup file — missing entries.");
      Object.keys(imported.entries).forEach(k=>{
        imported.entries[k] = migrateEntry(imported.entries[k]);
      });
      state = imported;
      if(!state.settings) state.settings = { heightCm: 192, targetWeightKg: 70 };
      if(!state.entries[todayISO()]) state.entries[todayISO()] = defaultDailyEntry();
      saveState();
      const status = document.getElementById("importStatus");
      if(status){
        status.textContent = "Backup imported successfully.";
        status.classList.remove("hidden");
      }
      renderMain();
    }catch(err){
      alert("Import failed: " + err.message);
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

  const iconSvg = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#15130F"/>
      <rect x="0" y="0" width="512" height="512" fill="none" stroke="#C4491D" stroke-width="16"/>

      <path d="M 220 190 L 250 235 L 200 240 Z" fill="#C4491D"/>
      <circle cx="256" cy="120" r="14" fill="#C4491D"/>
    </svg>`;
  const iconDataUri = "data:image/svg+xml;base64," + btoa(iconSvg);

  const manifest = {
    name: "SEND LOG — Climbing Coach",

    start_url: ".",
    scope: ".",

    ]
  };

  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
